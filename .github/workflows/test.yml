# Runs the test suite on pushes to main and on pull requests. No signing or secrets needed.
name: Test

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "assets/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "assets/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test
        run: xcodebuild test -project Yokoi.xcodeproj -scheme Yokoi -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO -quiet
