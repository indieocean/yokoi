# Runs the test suite on pushes to main and on pull requests. No signing or secrets needed.
name: Test

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "assets/**", "site/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "assets/**", "site/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to commit SHAs: a moved tag can't change what runs next to the signing secrets.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Test
        run: xcodebuild test -project Yokoi.xcodeproj -scheme Yokoi -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO -quiet
