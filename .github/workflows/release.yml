# Builds, signs, notarizes and publishes a release when a version tag is pushed:
#   git tag v1.2 && git push --tags
# The tag must match MARKETING_VERSION in the project. Secrets are described in docs/DEVELOPMENT.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      # Actions are pinned to commit SHAs: a moved tag can't change what runs next to the signing secrets.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Check the tag matches the app version
        run: |
          version=$(xcodebuild -project Yokoi.xcodeproj -scheme Yokoi -showBuildSettings 2>/dev/null | awk '$1 == "MARKETING_VERSION" { print $3; exit }')
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match MARKETING_VERSION $version"
            exit 1
          fi
          # Sparkle compares build numbers, so an update that reuses one is never offered.
          build=$(xcodebuild -project Yokoi.xcodeproj -scheme Yokoi -showBuildSettings 2>/dev/null | awk '$1 == "CURRENT_PROJECT_VERSION" { print $3; exit }')
          previous=$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/appcast.xml" 2>/dev/null \
            | sed -nE 's|.*<sparkle:version>([0-9.]+)</sparkle:version>.*|\1|p' | head -1)
          if [[ -n "$previous" ]] && ! awk -v a="$build" -v b="$previous" 'BEGIN { exit !(a + 0 > b + 0) }'; then
            echo "::error::CURRENT_PROJECT_VERSION $build must be higher than the last release's build $previous"
            exit 1
          fi

      - name: Test
        run: xcodebuild test -project Yokoi.xcodeproj -scheme Yokoi -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO -quiet

      - name: Import the Developer ID certificate
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          # Apple's intermediates, in case the export didn't include them.
          for ca in DeveloperIDCA DeveloperIDG2CA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$keychain" || true
          done
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build, sign and notarize
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          export NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$NOTARY_KEY" > "$NOTARY_KEY_PATH"
          export SPARKLE_KEY_PATH="$RUNNER_TEMP/sparkle.key"
          printf '%s\n' "$SPARKLE_KEY" > "$SPARKLE_KEY_PATH"
          scripts/release.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "build/release/Yokoi-$version.dmg" "build/release/Yokoi-$version.dmg.sha256" build/release/appcast.xml \
            --title "Yokoi $version" --generate-notes --verify-tag

      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/sparkle.key"
